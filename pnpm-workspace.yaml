# pnpm 12 no longer reads the `pnpm` field in package.json, and it refuses to
# install at all when a dependency's build script is neither allowed nor denied
# — `ERR_PNPM_IGNORED_BUILDS`. Locally that surfaced as a warning and an
# install that still worked; on Vercel it failed the build outright.
#
# So every build script this project encounters is decided here explicitly.
allowBuilds:
  # Prisma fetches its engine binaries in a postinstall. `prisma generate`
  # works without them, but the CLI needs them for `migrate`, and a deploy that
  # cannot migrate is worse than a slower cold install.
  prisma: true
  "@prisma/client": true
  "@prisma/engines": true
  # Downloads its platform binary. A transitive dependency of the test runner
  # and of Prisma's dev tooling.
  esbuild: true
  # Not needed: Next uses its own image pipeline here, and nothing imports
  # sharp directly. Denied rather than left undecided so the install does not
  # stop to ask.
  sharp: false
  unrs-resolver: false
